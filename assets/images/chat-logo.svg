<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#5B4BEA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8CF5"/>
      <stop offset="1" stop-color="#5B4BEA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1B1670" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed background (the OS rounds the corners for app icons) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Back bubble (the reply) -->
  <g fill="#ffffff" fill-opacity="0.42">
    <rect x="410" y="205" width="400" height="300" rx="100"/>
    <path d="M700 480 L790 585 Q800 600 782 596 L650 540 Z"/>
  </g>

  <!-- Front bubble -->
  <g filter="url(#shadow)" fill="#ffffff">
    <rect x="215" y="330" width="500" height="370" rx="120"/>
    <path d="M300 670 L268 808 Q262 830 284 820 L450 700 Z"/>
  </g>

  <!-- Typing dots -->
  <g fill="url(#dot)">
    <circle cx="350" cy="515" r="36"/>
    <circle cx="465" cy="515" r="36"/>
    <circle cx="580" cy="515" r="36"/>
  </g>
</svg>
